name: Publish academic website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build pages from editable data
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/build.py --out _site
      - name: Install R for browser teaching apps
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base r-base-dev
      - name: Install and cache Shiny export dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
          dependencies: 'NA'
      - name: Export interactive teaching apps
        run: Rscript scripts/export-shinylive.R
      - name: Verify pages and local links
        run: python3 scripts/verify.py --site _site
      - name: Check ANOVA calculations
        run: node scripts/check-anova.cjs
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
