<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拖曳散布圖</title><link rel="stylesheet" href="style.css"><script src="influence.js" defer></script>
<style>
body{background:white;margin:0} .chart{width:100%;max-width:735px;display:block;background:#f5f9f9;border:1px solid #d4e4e6;border-radius:8px;touch-action:none}
.point{cursor:grab;outline:none}.point:active{cursor:grabbing}.point:focus{stroke:#a94123;stroke-width:4}.chart text{font-size:15px;fill:#173b44;pointer-events:none}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:14px 0;max-width:735px}.metrics div{padding:10px;background:#eaf4f4;border-radius:6px}.metrics strong{display:block;font-size:19px}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:0 0 10px}.toolbar button,.toolbar select{padding:6px 10px;background:#fff;border:1px solid #a8c4c8;border-radius:5px;color:#173b44}
</style></head>
<body><div class="toolbar"><label for="point">選取觀測點</label><select id="point"></select><button id="reset" type="button">還原課本資料</button><label><input id="quadrants" type="checkbox"> 顯示 X̄、Ȳ 與四象限</label><label><input id="equation" type="checkbox"> 顯示迴歸方程式</label><label><input id="zx" type="checkbox"> X 軸用 z 分數</label><label><input id="zy" type="checkbox"> Y 軸用 z 分數</label></div>
<svg id="scatter" class="chart" viewBox="0 0 860 485" role="group" aria-label="可拖動的散布圖"><defs><clipPath id="plot-area"><rect x="62" y="22" width="766" height="390"/></clipPath></defs><g id="quadrant-shading"></g><g id="axis"></g><g id="quadrant-lines"></g><g clip-path="url(#plot-area)"><line id="without" stroke="#7958a4" stroke-dasharray="7 6" stroke-width="2"/><line id="line" stroke="#284e85" stroke-width="3"/><line id="residual" stroke="#b94723" stroke-width="4"/><g id="points"></g><circle id="mean-intersection" r="5" fill="white" stroke="#244c55" stroke-width="2" pointer-events="none" visibility="hidden"/></g></svg>
<p class="line-key"><span style="color:#284e85">━ 全部點迴歸線</span><span style="color:#7958a4">┄ 刪除選取點後的迴歸線</span><span style="color:#b94723">│ 殘差</span></p><p id="mean-pair" hidden></p><p id="quadrant-counts" class="quadrant-key" hidden></p><div id="equation-text" class="equation-box" hidden></div><div class="metrics" id="metrics" aria-live="polite"></div>
<p>水平移動會改變槓桿值。只改變高度時，該點的槓桿值維持固定，但殘差與影響值可能改變。</p></body></html>
