<article class="card"><h3>虛擬變數（dummy variables）與多項式迴歸（polynomial regression）</h3>
<p>有 k 組的類別變項可用 k − 1 個 0／1 欄表示。參照組（reference group）的各欄皆為 0。單一類別因子的截距為參照組平均數，其餘係數為對應組與參照組之差。在有截距時納入全部 k 欄會形成完全共線。</p>
<p>二次迴歸把 X、X² 同時納入，三次迴歸再加 X³。曲線的局部斜率隨 X 改變。通常保留低次項，再用相同樣本檢驗高次項的增量。解讀曲線時應標出觀測範圍，避免外推高次多項式。</p></article>
