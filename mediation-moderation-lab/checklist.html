<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="中介與調節效果分析的研究檢核，依量化研究法（二）第16、17章，附R、Python、SPSS PROCESS及Mplus範例。"><title>研究檢核｜中介與調節效果分析｜邱皓政</title><link rel="canonical" href="https://hawjeng.github.io/mediation-moderation-lab/checklist.html"><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="style.css?v=units-2"><script defer src="navigation.js?v=units-2"></script><script defer src="results/data.js"></script><script defer src="app.js?v=units-2"></script></head><body><a class="skip" href="#main">跳到內容</a><header><div class="header-inner"><a class="return-link" href="../resources.html#advanced-statistics-apps">返回教學與專案</a><a href="../index.html">邱皓政｜高階統計</a></div></header><main id="main"><div class="page-hero"><h1>中介與調節效果分析 <span lang="en">Mediation &amp; Moderation</span></h1><p>從交互作用到間接效果，理解效果如何傳遞、在什麼條件下改變。</p></div><nav class="main-tabs" aria-label="教材單元"><a href="index.html">原理</a><a href="examples.html">範例與互動</a><a href="syntax.html">語法與結果</a><a href="checklist.html" aria-current="page">研究檢核</a><a href="downloads.html">下載與來源</a><a href="references.html">參考文獻</a></nav><div class="lesson-frame"><h2>研究檢核</h2><p>完成模型估計後，逐項確認研究問題、推論設定與報告內容。</p><div class="checklist"><label><input type="checkbox">我已明確區分預測變數 x、中介 m、結果 y 與調節 w。</label><label><input type="checkbox">我已確認時間順序、研究設計與可能的共同原因。</label><label><input type="checkbox">調節模型保留低階項，簡單效果使用係數共變數計算區間。</label><label><input type="checkbox">J–N 結果只在實際觀察範圍內解讀，未忽略外推風險。</label><label><input type="checkbox">間接效果使用同一批個案重抽，並報告拔靴次數與區間方法。</label><label><input type="checkbox">組間差異直接檢驗效果差，沒有只比較兩個 p 值。</label><label><input type="checkbox">我已報告量尺、控制變數、缺失處理與軟體設定。</label></div><div class="section-head"><p class="eyebrow">CHECK YOUR UNDERSTANDING</p><h2>先做判斷，再看答案</h2></div><div class="two"><article class="card"><h3>總效果不顯著，就不能檢驗間接效果？</h3><button class="quiz" data-answer="false" type="button">正確</button><button class="quiz" data-answer="true" type="button">不正確</button><p class="feedback" role="status" data-explanation="不需把總效果顯著設為門檻。直接與間接效果可能方向相反而互相抵銷，應直接估計 ab 的區間。"></p></article><article class="card"><h3>一組顯著、另一組不顯著，就能證明兩組不同？</h3><button class="quiz" data-answer="false" type="button">可以</button><button class="quiz" data-answer="true" type="button">不可以</button><p class="feedback" role="status" data-explanation="須直接檢驗兩組效果差。本例對 IE(1)−IE(0) 進行個案拔靴，而非比較兩個顯著性標籤。"></p></article></div></div></main><footer>原理依據：<a href="../books/quantitative-ii-2021.html">《量化研究法（二）：統計原理與分析技術》</a>第 16、17 章 · <a href="downloads.html">資料與教材下載</a></footer></body></html>
